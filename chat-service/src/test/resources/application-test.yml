# Integration tests: Testcontainers provides MySQL and Kafka; user-service and notification-service are replaced by
# mocks (@MockitoBean on UserLookup and PresenceLookup), so nothing is called over HTTP.
spring:
  kafka:
    properties:
      # In-memory Schema Registry, shared by every serializer in the test JVM.
      schema.registry.url: mock://chat-service-tests

logging:
  level:
    com.fooddelivery: INFO

# No OTLP exporter in tests (there is no Tempo). Tracing export itself stays on: in Boot 4 it also turns on W3C
# propagation (traceparent in HTTP and Kafka headers, and outbox rows), which the tests rely on.
management:
  tracing:
    export:
      otlp:
        enabled: false

# The internal APIs' shared secret in the tests
app.security.internal-service-token: test-internal-service-token
