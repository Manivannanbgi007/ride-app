# Tempo, single process: receives traces over OTLP (from every service) and keeps them on local disk.
stream_over_http_enabled: true
server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks


# Traces are kept 2 days (development)
compactor:
  compaction:
    block_retention: 48h
