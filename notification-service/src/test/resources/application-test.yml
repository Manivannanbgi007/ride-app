# Integration tests (Testcontainers provides the datasource, Kafka and a Mailpit mail server;
# user-service and restaurant-service are mocked). Short retry delays keep the tests quick.
spring:
  kafka:
    properties:
      # In-memory Schema Registry, shared by every serializer and deserializer in the test JVM.
      schema.registry.url: mock://notification-service-tests
    consumer:
      # The test topics start empty: read from the beginning, so events published while the listeners
      # are still joining their group are not missed.
      auto-offset-reset: earliest

app:
  notifications:
    dispatch-interval: 200ms
    max-attempts: 2
    retry-delays: 1s
    lease: 30s

logging:
  level:
    com.fooddelivery: INFO

# No OTLP exporter in tests (there is no Tempo). Tracing export itself stays on: in Boot 4 it also turns on W3C
# propagation (traceparent in HTTP and Kafka headers, and outbox rows), which the tests rely on.
management:
  tracing:
    export:
      otlp:
        enabled: false

# The internal APIs' shared secret in the tests
app.security.internal-service-token: test-internal-service-token
