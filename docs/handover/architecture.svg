<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 482" width="800" height="482" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2e8244"/>
    </marker>
    <style>
      .svc { fill: #ffffff; stroke: #2e8244; stroke-width: 1.2; }
      .svc-name { font-size: 11.5px; font-weight: 700; fill: #174523; text-anchor: middle; }
      .svc-sub { font-size: 9.2px; fill: #55675a; text-anchor: middle; }
      .bus { stroke: #2e8244; stroke-width: 1.5; fill: none; }
      .drop { stroke: #2e8244; stroke-width: 1.3; marker-end: url(#arrow); }
      .evt { stroke: #8aa394; stroke-width: 1.1; stroke-dasharray: 3 3; }
      .infra { fill: #f5f8f6; stroke: #9fb3a6; stroke-width: 1.1; }
      .label { font-size: 9px; font-weight: 700; letter-spacing: 1.4px; fill: #55675a; }
    </style>
  </defs>

  <!-- Clients -->
  <rect x="180" y="8" width="440" height="54" rx="10" fill="#e9f4ec" stroke="#2e8244" stroke-width="1.5"/>
  <text x="400" y="31" font-size="14" font-weight="700" fill="#174523" text-anchor="middle">React Web Application (Front-App)</text>
  <text x="400" y="50" font-size="11" fill="#55675a" text-anchor="middle">Customer · Restaurant owner · Delivery partner · Platform admin</text>
  <line x1="400" y1="62" x2="400" y2="84" class="drop"/>
  <text x="410" y="78" font-size="10" fill="#55675a">HTTPS · REST · WebSocket</text>

  <!-- Gateway -->
  <rect x="100" y="86" width="600" height="50" rx="10" fill="#2e8244"/>
  <text x="400" y="107" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">API Gateway · Spring Cloud Gateway (8080)</text>
  <text x="400" y="126" font-size="10.5" fill="#e3f3e7" text-anchor="middle">Routing · per-service rate limits · circuit breakers · retries · request id · live WebSocket</text>

  <!-- Routing buses -->
  <line x1="400" y1="136" x2="400" y2="150" class="bus"/>
  <polyline points="20,226 20,150 748,150" class="bus"/>
  <line x1="20" y1="226" x2="748" y2="226" class="bus"/>
  <line x1="82" y1="150" x2="82" y2="160" class="drop"/>
  <line x1="188" y1="150" x2="188" y2="160" class="drop"/>
  <line x1="294" y1="150" x2="294" y2="160" class="drop"/>
  <line x1="400" y1="150" x2="400" y2="160" class="drop"/>
  <line x1="506" y1="150" x2="506" y2="160" class="drop"/>
  <line x1="612" y1="150" x2="612" y2="160" class="drop"/>
  <line x1="718" y1="150" x2="718" y2="160" class="drop"/>
  <line x1="82" y1="226" x2="82" y2="236" class="drop"/>
  <line x1="188" y1="226" x2="188" y2="236" class="drop"/>
  <line x1="294" y1="226" x2="294" y2="236" class="drop"/>
  <line x1="400" y1="226" x2="400" y2="236" class="drop"/>
  <line x1="506" y1="226" x2="506" y2="236" class="drop"/>
  <line x1="612" y1="226" x2="612" y2="236" class="drop"/>
  <line x1="718" y1="226" x2="718" y2="236" class="drop"/>

  <!-- Services, row 1: commerce -->
  <rect x="32" y="162" width="100" height="50" rx="8" class="svc"/>
  <text x="82" y="183" class="svc-name">User</text>
  <text x="82" y="200" class="svc-sub">8081 · user_db</text>
  <rect x="138" y="162" width="100" height="50" rx="8" class="svc"/>
  <text x="188" y="183" class="svc-name">Restaurant</text>
  <text x="188" y="200" class="svc-sub">8082 · restaurant_db</text>
  <rect x="244" y="162" width="100" height="50" rx="8" class="svc"/>
  <text x="294" y="183" class="svc-name">Catalog</text>
  <text x="294" y="200" class="svc-sub">8083 · catalog_db</text>
  <rect x="350" y="162" width="100" height="50" rx="8" class="svc"/>
  <text x="400" y="183" class="svc-name">Order</text>
  <text x="400" y="200" class="svc-sub">8084 · order_db</text>
  <rect x="456" y="162" width="100" height="50" rx="8" class="svc"/>
  <text x="506" y="183" class="svc-name">Payment</text>
  <text x="506" y="200" class="svc-sub">8085 · payment_db</text>
  <rect x="562" y="162" width="100" height="50" rx="8" class="svc"/>
  <text x="612" y="183" class="svc-name">Promotion</text>
  <text x="612" y="200" class="svc-sub">8089 · promotion_db</text>
  <rect x="668" y="162" width="100" height="50" rx="8" class="svc"/>
  <text x="718" y="183" class="svc-name">Review</text>
  <text x="718" y="200" class="svc-sub">8094 · review_db</text>

  <!-- Services, row 2: fulfilment, engagement, operations -->
  <rect x="32" y="238" width="100" height="50" rx="8" class="svc"/>
  <text x="82" y="259" class="svc-name">Delivery</text>
  <text x="82" y="276" class="svc-sub">8087 · delivery_db</text>
  <rect x="138" y="238" width="100" height="50" rx="8" class="svc"/>
  <text x="188" y="259" class="svc-name">Delivery Partner</text>
  <text x="188" y="276" class="svc-sub">8099 · partner_db</text>
  <rect x="244" y="238" width="100" height="50" rx="8" class="svc"/>
  <text x="294" y="259" class="svc-name">Notification</text>
  <text x="294" y="276" class="svc-sub">8086 · notification_db</text>
  <rect x="350" y="238" width="100" height="50" rx="8" class="svc"/>
  <text x="400" y="259" class="svc-name">Search</text>
  <text x="400" y="276" class="svc-sub">8088 · Elasticsearch</text>
  <rect x="456" y="238" width="100" height="50" rx="8" class="svc"/>
  <text x="506" y="259" class="svc-name">Chat</text>
  <text x="506" y="276" class="svc-sub">8096 · chat_db</text>
  <rect x="562" y="238" width="100" height="50" rx="8" class="svc"/>
  <text x="612" y="259" class="svc-name">Admin</text>
  <text x="612" y="276" class="svc-sub">8092 · admin_db</text>
  <rect x="668" y="238" width="100" height="50" rx="8" class="svc"/>
  <text x="718" y="259" class="svc-name">AI Assistant</text>
  <text x="718" y="276" class="svc-sub">8097 / 8098 · Redis</text>

  <!-- Events -->
  <line x1="82" y1="288" x2="82" y2="314" class="evt"/>
  <line x1="188" y1="288" x2="188" y2="314" class="evt"/>
  <line x1="294" y1="288" x2="294" y2="314" class="evt"/>
  <line x1="400" y1="288" x2="400" y2="314" class="evt"/>
  <line x1="506" y1="288" x2="506" y2="314" class="evt"/>
  <line x1="612" y1="288" x2="612" y2="314" class="evt"/>
  <rect x="32" y="314" width="736" height="40" rx="8" fill="#24342a"/>
  <text x="400" y="331" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">Event backbone · Apache Kafka (KRaft) + Confluent Schema Registry</text>
  <text x="400" y="347" font-size="10" fill="#c9d8ce" text-anchor="middle">Avro domain events · transactional outbox · idempotent consumers · dead-letter topics</text>

  <!-- Data and infrastructure -->
  <text x="32" y="372" class="label">DATA AND INFRASTRUCTURE</text>
  <rect x="32" y="378" width="140" height="46" rx="8" class="infra"/>
  <text x="102" y="397" class="svc-name">MySQL 8.4</text>
  <text x="102" y="413" class="svc-sub">12 databases, one per service</text>
  <rect x="181" y="378" width="140" height="46" rx="8" class="infra"/>
  <text x="251" y="397" class="svc-name">Redis 8</text>
  <text x="251" y="413" class="svc-sub">cache · rate limits · AI state</text>
  <rect x="330" y="378" width="140" height="46" rx="8" class="infra"/>
  <text x="400" y="397" class="svc-name">Elasticsearch 9</text>
  <text x="400" y="413" class="svc-sub">search read models</text>
  <rect x="479" y="378" width="140" height="46" rx="8" class="infra"/>
  <text x="549" y="397" class="svc-name">Ollama</text>
  <text x="549" y="413" class="svc-sub">local LLM for the assistant</text>
  <rect x="628" y="378" width="140" height="46" rx="8" class="infra"/>
  <text x="698" y="397" class="svc-name">SMTP (Mailpit)</text>
  <text x="698" y="413" class="svc-sub">e-mail (development)</text>

  <!-- Observability -->
  <rect x="32" y="436" width="736" height="36" rx="8" fill="#eaf3fb" stroke="#1f5f99" stroke-width="1.1"/>
  <text x="400" y="458" font-size="11" font-weight="600" fill="#1f5f99" text-anchor="middle">Observability · Micrometer + OpenTelemetry → Prometheus · Grafana · Loki · Tempo · Jaeger (via Grafana Alloy)</text>
</svg>
