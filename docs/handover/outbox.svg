<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="800" height="150" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2e8244"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #2e8244; stroke-width: 1.2; }
      .hot { fill: #e9f4ec; stroke: #2e8244; stroke-width: 1.5; }
      .dark { fill: #24342a; }
      .t { font-size: 11.5px; font-weight: 700; fill: #174523; text-anchor: middle; }
      .s { font-size: 9.4px; fill: #55675a; text-anchor: middle; }
      .tw { font-size: 11.5px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .sw { font-size: 9.4px; fill: #c9d8ce; text-anchor: middle; }
      .arr { stroke: #2e8244; stroke-width: 1.5; marker-end: url(#a); }
      .lab { font-size: 9px; fill: #55675a; text-anchor: middle; }
    </style>
  </defs>
  <rect x="6" y="30" width="120" height="78" rx="9" class="box"/>
  <text x="66" y="58" class="t">Client request</text>
  <text x="66" y="76" class="s">e.g. POST /orders</text>
  <text x="66" y="91" class="s">via API Gateway</text>

  <line x1="126" y1="69" x2="150" y2="69" class="arr"/>

  <rect x="152" y="14" width="190" height="110" rx="9" class="hot"/>
  <text x="247" y="38" class="t">Service: one DB transaction</text>
  <rect x="166" y="48" width="162" height="26" rx="5" fill="#ffffff" stroke="#9fb3a6"/>
  <text x="247" y="65" class="s">business row (e.g. orders)</text>
  <rect x="166" y="82" width="162" height="26" rx="5" fill="#ffffff" stroke="#9fb3a6"/>
  <text x="247" y="99" class="s">outbox_events row (Avro bytes)</text>
  <text x="247" y="138" class="lab">both saved, or neither</text>

  <line x1="342" y1="69" x2="366" y2="69" class="arr"/>

  <rect x="368" y="30" width="122" height="78" rx="9" class="box"/>
  <text x="429" y="58" class="t">Outbox relay</text>
  <text x="429" y="76" class="s">every 500 ms, oldest first</text>
  <text x="429" y="91" class="s">marks row when acked</text>

  <line x1="490" y1="69" x2="514" y2="69" class="arr"/>

  <rect x="516" y="30" width="118" height="78" rx="9" class="dark"/>
  <text x="575" y="58" class="tw">Kafka topic</text>
  <text x="575" y="76" class="sw">3 partitions, keyed</text>
  <text x="575" y="91" class="sw">by entity id</text>

  <line x1="634" y1="69" x2="658" y2="69" class="arr"/>

  <rect x="660" y="30" width="134" height="78" rx="9" class="box"/>
  <text x="727" y="58" class="t">Consumer service</text>
  <text x="727" y="76" class="s">skips repeats via</text>
  <text x="727" y="91" class="s">processed_events</text>
  <text x="727" y="124" class="lab">failures → topic.DLT</text>
</svg>
