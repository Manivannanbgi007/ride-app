                    fallbackUri: forward:/fallback/chat-service
                - name: Retry
                  args:
                    retries: ${app.gateway.services.chat-service.retries}
                    methods: GET
                    series: ""
                    exceptions: java.net.ConnectException, reactor.netty.http.client.PrematureCloseException
                    backoff: { firstBackoff: 100ms, maxBackoff: 500ms, factor: 2 }

            # Dashboard, reports, calendar and the platform-wide audit log (combined from the services that own the data)
            - id: admin-service
              uri: ${ADMIN_SERVICE_URL:http://localhost:8092}
              predicates:
                - Path=/api/v1/admin/dashboard/**,/api/v1/admin/reports/**,/api/v1/admin/audit-logs/**,/api/v1/admin/calendar/**
              metadata:
                connect-timeout: ${app.gateway.services.admin-service.connect-timeout}
                response-timeout: ${app.gateway.services.admin-service.response-timeout}
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${app.gateway.services.admin-service.requests-per-second}
                    redis-rate-limiter.burstCapacity: ${app.gateway.services.admin-service.burst}
                - name: CircuitBreaker
                  args:
                    name: admin-service
                    fallbackUri: forward:/fallback/admin-service
                - name: Retry
                  args:
                    retries: ${app.gateway.services.admin-service.retries}
                    methods: GET
                    series: ""
                    exceptions: java.net.ConnectException, reactor.netty.http.client.PrematureCloseException
                    backoff: { firstBackoff: 100ms, maxBackoff: 500ms, factor: 2 }

app:
  gateway:
    # ----------------------------------------------------------------------------------------------------------
    # Traffic settings per microservice, used by the routes above. Every value can also be set from an environment
    # variable: upper case, "." and "-" become "_", e.g. APP_GATEWAY_SERVICES_ORDER_SERVICE_RESPONSE_TIMEOUT=9000.
    #
    #   requests-per-second  throttling: each client (IP address) may send this service so many requests per second
    #   burst                ...and this many at once, before the per-second rate applies (over it: 429)
    #   connect-timeout      ms to open a connection to the service (it is down or unreachable after that)
    #   response-timeout     ms to wait for the service's answer (after that: 504 Gateway Timeout)
    #   retries              how often a GET request is sent again when the service could not be reached
    #                        (connection refused, or closed before the answer), after 100 ms, then 200 ms. 1 to 3.
    #                        Never after a timeout or an error answer, and never for POST/PUT/PATCH/DELETE: those
    #                        could, for example, place an order twice.
    #
    # The gateway checks these values when it starts (GatewayTrafficProperties) and refuses to start with a clear
    # message when one would misbehave, e.g. a response-timeout that is not below response-timeout-limit.
    # ----------------------------------------------------------------------------------------------------------
    # A service that asks another one gets more time: when the other service is slow, each of its calls can take
    # about 4 s before it gives up (2 s connect, 3 s read, one retry), and it still has to answer.
    # The assistant is not one of the ordinary services below: its answers are slow by nature (see the route)
    assistant: { requests-per-second: 2, burst: 10, connect-timeout: 2000, response-timeout: 170000 }
    services:
      # Own data only
      user-service:         { requests-per-second: 20, burst: 40, connect-timeout: 2000, response-timeout: 5000, retries: 2 }
      # Asks user-service (restaurant owners)
      restaurant-service:   { requests-per-second: 20, burst: 40, connect-timeout: 2000, response-timeout: 8000, retries: 2 }
      # Asks restaurant-service; many reads while customers browse menus
      catalog-service:      { requests-per-second: 40, burst: 80, connect-timeout: 2000, response-timeout: 8000, retries: 2 }
      # Checkout asks user-, restaurant-, catalog- and promotion-service one after the other
      order-service:        { requests-per-second: 20, burst: 40, connect-timeout: 2000, response-timeout: 9000, retries: 2 }
      # Asks order-service and the (simulated) payment provider; few payments per customer
      payment-service:      { requests-per-second: 10, burst: 20, connect-timeout: 2000, response-timeout: 8000, retries: 2 }
      # Own data only (notifications are sent from Kafka events, not during a request)
      notification-service: { requests-per-second: 20, burst: 40, connect-timeout: 2000, response-timeout: 5000, retries: 2 }
      # May ask order- and restaurant-service one after the other; going online may ask delivery-partner-service
      delivery-service:     { requests-per-second: 20, burst: 40, connect-timeout: 2000, response-timeout: 9000, retries: 2 }
      # Asks user-service (a partner's first call)
      delivery-partner-service: { requests-per-second: 20, burst: 40, connect-timeout: 2000, response-timeout: 8000, retries: 2 }
      # Elasticsearch only; search-as-you-type sends a request for (almost) every key press
      search-service:       { requests-per-second: 40, burst: 80, connect-timeout: 2000, response-timeout: 5000, retries: 2 }
      # Own data only
      promotion-service:    { requests-per-second: 20, burst: 40, connect-timeout: 2000, response-timeout: 5000, retries: 2 }
      # Asks order-service (to check an order) and catalog-service (dish photos) when a review is written or listed
      review-service:       { requests-per-second: 20, burst: 40, connect-timeout: 2000, response-timeout: 8000, retries: 2 }
      # Own data; the open chat page also refreshes on live hints, so reads are frequent
      chat-service:         { requests-per-second: 30, burst: 60, connect-timeout: 2000, response-timeout: 5000, retries: 2 }
      # The dashboard and reports ask six services at once (each request costs them six), and wait up to 5 s for them
      admin-service:        { requests-per-second: 10, burst: 20, connect-timeout: 2000, response-timeout: 9000, retries: 2 }

    # The circuit breakers' overall time limit (CircuitBreakerConfig): a safety net above every response-timeout.
    # Also bounds a GET with retries: the client never waits longer than this.
    response-timeout-limit: ${GATEWAY_RESPONSE_TIMEOUT_LIMIT:10s}

  # Login and registration (route user-auth): attempts per client (IP address) per minute. Over it: 429.
  # Session refresh and sign-out (route user-auth-session): requests per client per minute, a separate budget.
  rate-limit:
    auth-requests-per-minute: ${GATEWAY_AUTH_RATE_LIMIT_PER_MINUTE:10}
    session-requests-per-minute: ${GATEWAY_SESSION_RATE_LIMIT_PER_MINUTE:30}

management:
  # Observability (Phase 14b): metrics scraped by Prometheus, traces sent to Tempo
  metrics:
    tags:
      # Every metric says which service it comes from
      application: ${spring.application.name}
    distribution:
      # Response-time histograms, so Grafana can show percentiles (p95) over all instances
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      # Every request is traced in development; lower it in production (e.g. 0.1)
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        # Metrics are scraped by Prometheus, not pushed
        enabled: false
  endpoints:
    web:
      exposure:
        include: health, info, gateway, prometheus
  endpoint:
    gateway:
      access: read-only
  info:
    env:
      enabled: true
  # Redis is optional here (cache / rate limits): the service keeps working without it, so it must not report
  # DOWN when Redis is unreachable. Redis itself is monitored separately.
  health:
    redis:
      enabled: false

info:
  application:
    name: ${spring.application.name}
    description: Single entry point for the Food Delivery platform

logging:
  pattern:
    # Adds the trace and span ids to every log line: [traceId,spanId] (Loki links logs to traces with it)
    correlation: "[%X{traceId:-},%X{spanId:-}] "
  level:
    # Spring's Redis limiter logs a stack trace for every failed call, under the name of our subclass;
    # OutageAwareRedisRateLimiter logs the outage once instead (as RateLimitConfig). Quoted: a bare OFF is read
    # as the boolean false.
    com.fooddelivery.apigateway.config.OutageAwareRedisRateLimiter: "OFF"
