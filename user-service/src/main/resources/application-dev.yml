# Local development
app:
  jwt:
    # No JWT_PRIVATE_KEY in .env: generate a temporary signing key at startup (logged as a warning)
    allow-ephemeral-key: true
  auth:
    refresh-cookie:
      # The web app runs on plain http://localhost in development
      secure: false

logging:
  level:
    com.fooddelivery: DEBUG
    # Uncomment to see the SQL Hibernate runs:
    # org.hibernate.SQL: DEBUG

# Development only: the services' shared secret of the internal APIs (set INTERNAL_SERVICE_TOKEN elsewhere)
app.security.internal-service-token: ${INTERNAL_SERVICE_TOKEN:dev-internal-service-token}
