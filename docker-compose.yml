  # ---------------------------------------------------------------------------
  # Code quality (started only with: --profile quality), see quality/README.md
  # SonarQube keeps the analysis of every service; quality/sonar-scan.ps1 runs it.
  # Needs about 3 GB of memory: stop the apps first if Docker is short of it.
  # ---------------------------------------------------------------------------

  sonarqube-db:
    image: postgres:17.11-alpine
    container_name: fd-sonarqube-db
    profiles: ["quality"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonarqube
      POSTGRES_PASSWORD: ${SONARQUBE_DB_PASSWORD:?Set SONARQUBE_DB_PASSWORD in .env}
    volumes:
      - sonarqube-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonarqube -d sonarqube"]
      interval: 5s
      timeout: 5s
      retries: 20

  sonarqube:
    image: sonarqube:26.9.0.129388-community
    container_name: fd-sonarqube
    profiles: ["quality"]
    restart: unless-stopped
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonarqube
      SONAR_JDBC_PASSWORD: ${SONARQUBE_DB_PASSWORD:?Set SONARQUBE_DB_PASSWORD in .env}
      # The embedded Elasticsearch would otherwise require vm.max_map_count >= 524288 on the Docker host
      SONAR_SEARCH_JAVAADDITIONALOPTS: "-Dnode.store.allow_mmap=false"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    ports:
      - "9000:9000"

