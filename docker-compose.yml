        # condition: service_healthy
    # environment:
      # KAFKA_CLUSTERS_0_NAME: food-delivery
      # KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      # KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      # # Connectors tab (only answers when profile "cdc" is running)
      # KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      # KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
    # ports:
      # - "8090:8080"

  # Development mail server: catches every email the platform sends. Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.4
    container_name: fd-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${MAILPIT_HOST_PORT:-8025}:8025"   # web UI and API
      - "${MAILPIT_SMTP_HOST_PORT:-1025}:1025"   # SMTP
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Cache and rate-limit counters only (MySQL stays the source of truth): no persistence, so a restart starts
  # empty, and when memory is full only keys with an expiry are evicted (cached pages, rate-limit buckets),
  # never the small cache "generation" counters.
  redis:
    image: redis:8.10.2-alpine
    container_name: fd-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Search index only (MySQL stays the source of truth). Development settings: one node, no TLS/passwords
  # (security comes in the security phase), and no index is ever created implicitly (search-service creates
  # its indexes with their mappings).
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.5
    container_name: fd-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      action.auto_create_index: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${ELASTICSEARCH_HOST_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Data UIs (development): Kibana for Elasticsearch, phpMyAdmin for MySQL.
  # Both listen on this machine only (127.0.0.1).
  # ---------------------------------------------------------------------------

  # DISABLED 2026-10-13 to give Docker more memory: uncomment Kibana and kibana-setup below to use them again.
