      # retries: 30
      # start_period: 60s

  # # Once Kibana is up: data views for the restaurant, food and category indexes (Discover shows them at once).
  # # Safe to run again; the container exits when done.
  # kibana-setup:
    # image: curlimages/curl:8.22.0
    # container_name: fd-kibana-setup
    # restart: "no"
    # entrypoint: ["sh", "/setup/create-data-views.sh"]
    # volumes:
      # - ./infrastructure/kibana/create-data-views.sh:/setup/create-data-views.sh:ro
    # depends_on:
