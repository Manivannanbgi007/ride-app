  # phpMyAdmin: browse and edit the services' databases, run SQL, export and import. http://localhost:8095
  # Log in as root (MYSQL_ROOT_PASSWORD in .env), or as one service's user (e.g. order_svc / ORDER_DB_PASSWORD),
  # who sees only that service's database.
  phpmyadmin:
    image: phpmyadmin:5.2.3
    container_name: fd-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:${PHPMYADMIN_HOST_PORT:-8095}:80"
    depends_on:
      mysql:
        condition: service_healthy

