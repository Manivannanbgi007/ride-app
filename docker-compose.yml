# Food Delivery Platform - local infrastructure and services.
#
# Infrastructure only:      docker compose up -d
# Infrastructure + apps:    .\start-local.ps1 (the app services are commented out below; Docker runs the infrastructure)
# SonarQube (code quality): docker compose --profile quality up -d
# Debezium CDC (shadow):    docker compose --profile cdc up -d   (see infrastructure/debezium/README.md)
# AI assistant: Ollama starts with the infrastructure; ai-mcp-server/-client run locally (see docs/ai-assistant-architecture.md)
#
# Copy .env.example to .env before the first start.
#
# Another project already uses these ports (Kafka 9092, Redis 6379...)? .\start-local.ps1 -PortOffset 10000 moves every
# port of the platform by 10000 (gateway 18080, Kafka 19092...); by hand, set the *_HOST_PORT values of .env.example.
#
# Tools:  Mailpit   http://localhost:8025   (every email the platform sends)
#         Elasticsearch http://localhost:9200 (search indexes: restaurant, food, category)
#         phpMyAdmin http://localhost:8095  (MySQL UI: log in as root or as a service's database user)
#         Redis     localhost:6379          (cache and rate limits: docker exec -it fd-redis redis-cli)
#         SonarQube http://localhost:9000   (code quality; profile "quality")
#
# Disabled on 2026-10-13 to give Docker more memory (their blocks below are commented out; uncomment to use again):
#         Kafka UI  http://localhost:8090   (topics, messages, consumer groups, schemas)
#         Kibana    http://localhost:5601   (Elasticsearch UI: Discover, Dev Tools)
#         Grafana   http://localhost:3000   (dashboards, traces, logs; Food Delivery folder)
#         Prometheus http://localhost:9090  (metrics)  Tempo http://localhost:3200 (traces)  Loki http://localhost:3100 (logs)
#         Jaeger    http://localhost:16686  (traces: slow requests, request flow, latency per operation)

name: food-delivery

# Shared settings of the services that publish or consume Kafka events.
x-kafka-clients: &kafka-clients
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  SCHEMA_REGISTRY_URL: http://schema-registry:8081

# Every service sends its traces (OpenTelemetry, OTLP over HTTP) to Alloy, which passes them on to Tempo and Jaeger.
# The Observability services are disabled (see below): sampling 0 records no trace, so nothing is sent to the missing
# Alloy (the trace ids are still in every log line). Set 1.0 again when Observability is enabled again.
x-tracing: &tracing
  OTEL_TRACES_ENDPOINT: http://alloy:4318/v1/traces
  TRACING_SAMPLING_PROBABILITY: "0"

x-kafka-dependencies: &kafka-dependencies
  mysql:
    condition: service_healthy
  kafka:
    condition: service_healthy
  schema-registry:
    condition: service_healthy

services:

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------

  mysql:
    image: mysql:8.4
    container_name: fd-mysql
    restart: unless-stopped
    # Binary logging is on (MySQL's default): without this, only users with SUPER may create triggers.
    # admin-service's migrations create two (they keep audit records immutable); they are deterministic, so this is safe.
    command: ["--log-bin-trust-function-creators=1",
      # Binary log settings that Debezium (profile "cdc") needs; they are MySQL 8.4's defaults, written down so a change is visible.
      # ROW + FULL: every change is logged with the complete row. Kept 7 days: a connector that was off for longer must re-snapshot.
      "--server-id=1", "--binlog-format=ROW", "--binlog-row-image=FULL", "--binlog-expire-logs-seconds=604800"]
    environment:
      TZ: UTC
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?Set USER_DB_PASSWORD in .env}
      RESTAURANT_DB_PASSWORD: ${RESTAURANT_DB_PASSWORD:?Set RESTAURANT_DB_PASSWORD in .env}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Set CATALOG_DB_PASSWORD in .env}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?Set ORDER_DB_PASSWORD in .env}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?Set PAYMENT_DB_PASSWORD in .env}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Set NOTIFICATION_DB_PASSWORD in .env}
      DELIVERY_DB_PASSWORD: ${DELIVERY_DB_PASSWORD:?Set DELIVERY_DB_PASSWORD in .env}
      DELIVERY_PARTNER_DB_PASSWORD: ${DELIVERY_PARTNER_DB_PASSWORD:?Set DELIVERY_PARTNER_DB_PASSWORD in .env}
      PROMOTION_DB_PASSWORD: ${PROMOTION_DB_PASSWORD:?Set PROMOTION_DB_PASSWORD in .env}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:?Set ADMIN_DB_PASSWORD in .env}
      REVIEW_DB_PASSWORD: ${REVIEW_DB_PASSWORD:?Set REVIEW_DB_PASSWORD in .env}
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD:?Set CHAT_DB_PASSWORD in .env}
      # Only needed for profile "cdc" (see infrastructure/debezium)
      DEBEZIUM_DB_PASSWORD: ${DEBEZIUM_DB_PASSWORD:-}
    ports:
      # Host port 3330 avoids clashing with other MySQL instances on 3306-3312.
      - "${MYSQL_PORT:-3330}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infrastructure/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---------------------------------------------------------------------------
  # AI assistant: the LLM runtime (starts with the infrastructure). Spring AI in ai-mcp-server talks to it; nothing else does.
  # CPU only on this machine, so the model is a small one that still supports tool calling (see .env OLLAMA_MODEL).
  # ---------------------------------------------------------------------------

  ollama:
    image: ollama/ollama:0.40.2
    container_name: fd-ollama
    restart: unless-stopped
    environment:
      # Keep the model in memory between questions (loading it again takes a while on a CPU)
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      # One question at a time per loaded model: more parallelism only splits the same CPU
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
    volumes:
      # Models are large: they live in a named volume and survive "docker compose down"
      - ollama-data:/root/.ollama
    ports:
      # Loopback only: the API has no authentication, so it must not be reachable from the network
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11434}:11434"
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEMORY_LIMIT:-10g}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  # One-shot: downloads the model into the volume the first time (and does nothing when it is already there).
  ollama-pull:
    image: ollama/ollama:0.40.2
    container_name: fd-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen3:4b-instruct-2507-q4_K_M}"]
    restart: "no"

  # Single Kafka node in KRaft mode (no ZooKeeper): it is both broker and controller.
  kafka:
    image: confluentinc/cp-kafka:8.2.4
    container_name: fd-kafka
    restart: unless-stopped
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      # INTERNAL: other containers (kafka:29092). EXTERNAL: services on this machine (localhost and the host port).
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # One node, so every internal topic has a single copy.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created by the services that own them (with the right number of partitions).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # The INTERNAL listener: the EXTERNAL one tells its clients the host's port, which does not exist in here
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:29092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Stores the Avro schemas of all events and checks that new versions stay compatible.
  schema-registry:
    image: confluentinc/cp-schema-registry:8.2.4
    container_name: fd-schema-registry
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports:
      # Not 8081 on the host: that is user-service's port.
      - "${SCHEMA_REGISTRY_HOST_PORT:-8091}:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Change data capture (profile "cdc"): docker compose --profile cdc up -d
  # Debezium reads MySQL's binary log and publishes every change of the captured tables to Kafka (topics fdcdc.*).
  # Shadow mode: nothing consumes these topics yet and the outbox tables are untouched. See infrastructure/debezium/README.md
  # ---------------------------------------------------------------------------

  kafka-connect:
    image: quay.io/debezium/connect:3.0.0.Final
    container_name: fd-kafka-connect
    restart: unless-stopped
    profiles: ["cdc"]
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      # Workers with the same GROUP_ID share the connectors (add tasks for more capacity or failover)
      GROUP_ID: fd-connect
      CONFIG_STORAGE_TOPIC: fd-connect-configs
      OFFSET_STORAGE_TOPIC: fd-connect-offsets
      STATUS_STORAGE_TOPIC: fd-connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      # JSON without the embedded schema: readable in Kafka UI
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    ports:
      # 8083 is taken by catalog-service on the host.
      - "8093:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # One-shot: registers the connector once Kafka Connect is up, then exits.
  cdc-register:
    image: curlimages/curl:8.11.1
    container_name: fd-cdc-register
    profiles: ["cdc"]
    depends_on:
      kafka-connect:
        condition: service_healthy
    environment:
      CONNECT_URL: http://kafka-connect:8083
      DEBEZIUM_DB_PASSWORD: ${DEBEZIUM_DB_PASSWORD:?Set DEBEZIUM_DB_PASSWORD in .env for profile cdc}
    volumes:
      - ./infrastructure/debezium:/config:ro
    entrypoint: ["sh", "/config/register-connector.sh"]
    restart: "no"

  # DISABLED 2026-10-13 to give Docker more memory: uncomment kafka-ui below to use it again.
